<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sakti-code</title>
    <script>
    "use strict";
    // CEF on Linux ignores the OS DPI scale factor. The bun side passes
    // the real OS scale via ?dpr=. If the webview's devicePixelRatio is
    // lower than the OS scale, apply a CSS zoom to compensate. Runs
    // synchronously in <head> to prevent a flash of unscaled content.
    (() => {
      const dpr = Number.parseFloat(
        new URLSearchParams(location.search).get("dpr") || "1"
      );
      if (dpr > 1 && window.devicePixelRatio < dpr - 0.01) {
        document.documentElement.style.zoom = String(
          dpr / window.devicePixelRatio
        );
      }
    })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.tsx"></script>
  </body>
</html>
