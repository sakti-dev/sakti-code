<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sakti-code</title>
    <style>
    body {
      margin: 2rem;
      font-family: system-ui, sans-serif;
      color: #e6e6e6;
      background: #0b0d10;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    pre {
      padding: 1rem;
      white-space: pre-wrap;
      background: #14181c;
      border-radius: 8px;
    }
    .ok {
      color: #4ade80;
    }
    .err {
      color: #f87171;
    }
    </style>
  </head>
  <body>
    <h1>sakti-code desktop — smoke</h1>
    <pre id="out" class="ok">booting…</pre>
    <script type="module">
    const out = document.getElementById("out");
    try {
      const { baseUrl } = await window.sakti.server.getConfig();
      const health = await fetch(`${baseUrl}/api/health`).then((r) => r.json());
      out.textContent = `server: ${baseUrl}\nhealth: ${JSON.stringify(health)}`;
      out.className = "ok";
    } catch (e) {
      out.textContent = `ERR: ${e?.message ?? e}`;
      out.className = "err";
    }
    </script>
  </body>
</html>
